name: Build APK — Domyos500B Bridge

# À chaque push sur main ou tag v* : build l'APK debug (auto-signé, installable)
# et le publie en artifact téléchargeable. Sur n'importe quel tag, crée aussi
# une GitHub Release avec l'APK + un QR code scannable depuis le téléphone.

on:
  push:
    branches: [main]
    # Sur main : build + publication dans la release roulante « nightly » (tag créé
    # par le step release ci-dessous — il ne redéclenche PAS de build car tags = v*).
    # Sur tag v* : build + release avec QR code.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer les releases (softprops/action-gh-release)

jobs:
  build:
    name: Build APK (assembleDebug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer le SDK Android (cmdline-tools)
        uses: android-actions/setup-android@v4
        with:
          # Version longue (build number) requise depuis setup-android v3+ : "latest" n'existe plus.
          # 15859902 = cmdline-tools 22.0 (version courante).
          cmdline-tools-version: 15859902

      - name: Installer platform-36 + build-tools 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Installer Gradle 9.0.0 (officiel)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.0.0

      - name: Générer le wrapper si le jar est absent + rendre gradlew exécutable
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.0.0 --distribution-type bin
          fi
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew

      - name: Compiler l'APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: URL de téléchargement direct (pour le QR code)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        id: url
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then tag="nightly"; else tag="${{ github.ref_name }}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk_url=https://github.com/${{ github.repository }}/releases/download/$tag/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Générer le QR code vers l'APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -sSL -G -o qr-code.png "https://api.qrserver.com/v1/create-qr-code/" \
            --data-urlencode "size=500x500" \
            --data-urlencode "data=${{ steps.url.outputs.apk_url }}"
          file qr-code.png

      - name: Upload de l'APK en artifact (onglet Actions, rétention 90 jours)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Publier APK + QR code dans une release (nightly sur main, v* sur tag)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.url.outputs.tag }}
          name: Domyos500B Bridge ${{ steps.url.outputs.tag }}
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          fail_on_unmatched_files: false
          body: |
            ## Installation sur le Pixel 6 Pro (Android 16)

            1. Ouvrir ce lien sur le téléphone (ou scanner le QR code `qr-code.png`) :
               ${{ steps.url.outputs.apk_url }}
            2. Autoriser le navigateur à « installer des applications inconnues ».
            3. Ouvrir l'APK téléchargé → Installer.
            4. Dans l'app : accepter les permissions Bluetooth/notification,
               « Batterie sans restriction », puis « Démarrer le bridge ».
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            qr-code.png
